name: "RAG corpus contracts"
description: "Gate RAG ingest or merges on a data contract for chunk files."
branding:
  icon: "shield"
  color: "green"
inputs:
  contract:
    description: "Path to the contract YAML"
    required: true
  data:
    description: "Path to the corpus file (.jsonl, .ndjson, .parquet, .csv)"
    required: true
  fail-on-warn:
    description: "Treat warn-level checks as failures"
    required: false
    default: "false"
  python-version:
    description: "Python version to run corpusgate with"
    required: false
    default: "3.12"
outputs:
  report:
    description: "Path to the Markdown report"
    value: ${{ steps.corpusgate.outputs.report }}
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install corpusgate
      shell: bash
      run: python -m pip install --disable-pip-version-check -q "${GITHUB_ACTION_PATH}"
    - name: Run contract
      id: corpusgate
      shell: bash
      env:
        CORPUSGATE_CONTRACT: ${{ inputs.contract }}
        CORPUSGATE_DATA: ${{ inputs.data }}
        CORPUSGATE_FAIL_ON_WARN: ${{ inputs.fail-on-warn }}
      run: |
        report="${RUNNER_TEMP}/corpusgate-report.md"
        extra=()
        if [ "${CORPUSGATE_FAIL_ON_WARN}" = "true" ]; then extra+=(--fail-on-warn); fi
        set +e
        corpusgate check --contract "${CORPUSGATE_CONTRACT}" --data "${CORPUSGATE_DATA}" --format markdown --out "${report}" "${extra[@]}"
        code=$?
        set -e
        echo "report=${report}" >> "${GITHUB_OUTPUT}"
        if [ -f "${report}" ]; then cat "${report}" >> "${GITHUB_STEP_SUMMARY}"; fi
        exit "${code}"
