name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (coverage gate 90%)
        run: pytest
      - name: Security scan (bandit)
        run: bandit -q -r src
      - name: Dependency audit of runtime deps (pip-audit)
        run: pip-audit .

  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Samples are reproducible
        run: |
          python examples/make_samples.py
          git diff --exit-code examples/
      - name: Good corpus passes
        run: corpusgate check -c examples/contract.yaml -d examples/good_chunks.jsonl
      - name: Bad corpus must fail with exit 1
        run: |
          set +e
          corpusgate check -c examples/contract.yaml -d examples/bad_chunks.jsonl -f markdown -o bad.md
          code=$?
          cat bad.md >> "$GITHUB_STEP_SUMMARY"
          test "$code" -eq 1

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Action passes on good corpus
        uses: ./
        with:
          contract: examples/contract.yaml
          data: examples/good_chunks.jsonl
      - name: Action fails on bad corpus
        id: bad
        continue-on-error: true
        uses: ./
        with:
          contract: examples/contract.yaml
          data: examples/bad_chunks.jsonl
      - name: Assert the bad run failed
        if: steps.bad.outcome != 'failure'
        run: exit 1
